name: One-time Telegram editorial sample
on:
  pull_request:
    branches: [main]
    types: [opened]
permissions:
  contents: read
concurrency:
  group: one-time-telegram-editorial-10
  cancel-in-progress: false
jobs:
  editorial-sample:
    if: >-
      github.repository == 'khantthuaung-kta/techpulse-ai' &&
      github.event.pull_request.number == 10 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dot/telegram-editorial-sample-20261124' &&
      github.event.pull_request.user.login == 'khantthuaung-kta' &&
      github.event.pull_request.draft == true &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      EXPECTED_SHA256: 'fd24823c14c594c4fd254158719535e70d5b183669e5357780071b3004e49dff'
      PRIVATE_PREVIEW: 'previews/2026-11-24-n2-live-sample.md'
    steps:
      - name: Verify and stage the exact private preview
        env:
          TECHPULSE_DIGEST_READ_TOKEN: ${{ secrets.TECHPULSE_DIGEST_READ_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import pathlib
          import re
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          path = os.environ["PRIVATE_PREVIEW"]
          expected_hash = os.environ["EXPECTED_SHA256"]
          token = os.environ.get("TECHPULSE_DIGEST_READ_TOKEN", "").strip()
          if not token or not re.fullmatch(r"[0-9a-f]{64}", expected_hash):
              raise SystemExit("Missing the inbox credential or exact preview digest; nothing sent.")
          if not re.fullmatch(r"previews/[A-Za-z0-9][A-Za-z0-9._-]{0,90}\.md", path):
              raise SystemExit("Invalid preview path; nothing sent.")
          url = f"https://api.github.com/repos/khantthuaung-kta/techpulse-digest-inbox/contents/{path}?ref=main"
          request = urllib.request.Request(
              url,
              headers={"Accept": "application/vnd.github.raw+json", "Authorization": f"Bearer {token}"},
              method="GET",
          )
          try:
              with urllib.request.build_opener(NoRedirect).open(request, timeout=12) as response:
                  raw = response.read(16385)
              if len(raw) > 16384 or hashlib.sha256(raw).hexdigest() != expected_hash:
                  raise ValueError
              value = raw.decode("utf-8")
              if not value.strip() or len(value.encode("utf-16-le")) // 2 > 3500:
                  raise ValueError
              if any(ord(c) < 32 and c not in "\n\r\t" for c in value):
                  raise ValueError
              output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "techpulse-editorial-preview-10.txt"
              with output.open("xb") as handle:
                  output.chmod(0o600)
                  handle.write(raw)
          except (OSError, UnicodeError, ValueError):
              raise SystemExit("Could not verify the exact private preview; nothing sent.") from None
          print("Private preview checksum and UTF-8 length verified (content omitted).")
          PY
      - name: Send one literal preview to the existing Telegram recipient
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not re.fullmatch(r"[0-9]+:[A-Za-z0-9_-]+", token) or not re.fullmatch(r"-?[1-9][0-9]{0,17}", chat):
              raise SystemExit("The existing Telegram destination has not been verified; nothing sent.")
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "techpulse-editorial-preview-10.txt"
          try:
              data = path.read_bytes()
              path.unlink()
              if hashlib.sha256(data).hexdigest() != os.environ["EXPECTED_SHA256"]:
                  raise ValueError
              value = data.decode("utf-8")
              if not value.strip() or len(value.encode("utf-16-le")) // 2 > 3500:
                  raise ValueError
          except (OSError, ValueError):
              raise SystemExit("The staged preview did not verify; nothing sent.") from None
          body = json.dumps(
              {"chat_id": int(chat), "text": value, "link_preview_options": {"is_disabled": True}},
              ensure_ascii=False,
          ).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage", body,
              {"Content-Type": "application/json"}, method="POST",
          )
          try:
              with urllib.request.build_opener(NoRedirect).open(request, timeout=12) as response:
                  data = json.loads(response.read(131072))
          except (OSError, ValueError):
              raise SystemExit("Telegram did not confirm delivery. Do not retry this sample.") from None
          result = data.get("result") if isinstance(data, dict) and data.get("ok") is True else None
          reply_chat = result.get("chat") if isinstance(result, dict) else None
          message_id = result.get("message_id") if isinstance(result, dict) else None
          if not isinstance(reply_chat, dict) or reply_chat.get("id") != int(chat) or type(message_id) is not int or message_id < 1:
              raise SystemExit("Telegram acknowledgement could not be verified. Do not retry.")
          print(f"Telegram accepted exactly one editorial sample; message_id={message_id}")
          PY
