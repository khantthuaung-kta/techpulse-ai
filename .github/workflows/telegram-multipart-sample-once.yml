name: One-time Telegram multipart sample
on:
  pull_request:
    branches: [main]
    types: [opened]
permissions:
  contents: read
concurrency:
  group: one-time-telegram-multipart-12
  cancel-in-progress: false
jobs:
  editorial-sample:
    if: >-
      github.repository == 'khantthuaung-kta/techpulse-ai' &&
      github.event.pull_request.number == 12 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dot/telegram-multipart-sample-20261124' &&
      github.event.pull_request.user.login == 'khantthuaung-kta' &&
      github.event.pull_request.draft == true &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SHA256: 'ca8491a37e5a00a0523be3dec82474909a4fe7bac75ee3f12d7f86223dd2c818'
      PRIVATE_PREVIEW: 'previews/2026-11-24-n2-multipart-live-sample.md'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify and stage the exact private preview
        env:
          TECHPULSE_DIGEST_READ_TOKEN: ${{ secrets.TECHPULSE_DIGEST_READ_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import pathlib
          import re
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          path = os.environ["PRIVATE_PREVIEW"]
          expected_hash = os.environ["EXPECTED_SHA256"]
          token = os.environ.get("TECHPULSE_DIGEST_READ_TOKEN", "").strip()
          if not token or not re.fullmatch(r"[0-9a-f]{64}", expected_hash):
              raise SystemExit("Missing the inbox credential or exact preview digest; nothing sent.")
          if not re.fullmatch(r"previews/[A-Za-z0-9][A-Za-z0-9._-]{0,90}\.md", path):
              raise SystemExit("Invalid preview path; nothing sent.")
          url = f"https://api.github.com/repos/khantthuaung-kta/techpulse-digest-inbox/contents/{path}?ref=main"
          request = urllib.request.Request(
              url,
              headers={"Accept": "application/vnd.github.raw+json", "Authorization": f"Bearer {token}"},
              method="GET",
          )
          try:
              with urllib.request.build_opener(NoRedirect).open(request, timeout=12) as response:
                  raw = response.read(61_441)
              if len(raw) > 61_440 or hashlib.sha256(raw).hexdigest() != expected_hash:
                  raise ValueError
              value = raw.decode("utf-8")
              if not value.strip() or len(value.encode("utf-16-le")) // 2 > 25_000:
                  raise ValueError
              if any(ord(c) < 32 and c not in "\n\r\t" for c in value):
                  raise ValueError
              output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "techpulse-multipart-preview-12.txt"
              with output.open("xb") as handle:
                  output.chmod(0o600)
                  handle.write(raw)
          except (OSError, UnicodeError, ValueError):
              raise SystemExit("Could not verify the exact private preview; nothing sent.") from None
          print("Private preview checksum and UTF-8 length verified (content omitted).")
          PY
      - name: Send ordered production-rendered parts to the existing Telegram recipient
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          from html import unescape
          import os
          import pathlib
          import re
          import time
          import urllib.request

          from techpulse.digest import TELEGRAM_LIMIT, telegram_length
          from techpulse.dot_inbox import split_dot_digest

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not re.fullmatch(r"[0-9]+:[A-Za-z0-9_-]+", token) or not re.fullmatch(r"-?[1-9][0-9]{0,17}", chat):
              raise SystemExit("The existing Telegram destination has not been verified; nothing sent.")
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "techpulse-multipart-preview-12.txt"
          try:
              data = path.read_bytes()
              path.unlink()
              if hashlib.sha256(data).hexdigest() != os.environ["EXPECTED_SHA256"]:
                  raise ValueError
              value = data.decode("utf-8")
              if not value.strip() or len(value.encode("utf-16-le")) // 2 > 25_000:
                  raise ValueError
          except (OSError, ValueError):
              raise SystemExit("The staged preview did not verify; nothing sent.") from None
          parts = split_dot_digest(value)
          if len(parts) < 2 or any(telegram_length(unescape(part)) > TELEGRAM_LIMIT for part in parts):
              raise SystemExit("Production renderer did not return valid multipart output; nothing sent.")
          opener = urllib.request.build_opener(NoRedirect)
          previous = 0
          for index, part in enumerate(parts, 1):
              if index > 1:
                  time.sleep(1.15)
              body = json.dumps(
                  {"chat_id": int(chat), "text": part, "parse_mode": "HTML",
                   "link_preview_options": {"is_disabled": True}},
                  ensure_ascii=False,
              ).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage", body,
                  {"Content-Type": "application/json"}, method="POST",
              )
              try:
                  with opener.open(request, timeout=12) as response:
                      result_data = json.loads(response.read(131072))
              except (OSError, ValueError):
                  raise SystemExit(f"Telegram did not confirm part {index}/{len(parts)}. Do not retry this sample.") from None
              result = result_data.get("result") if isinstance(result_data, dict) and result_data.get("ok") is True else None
              reply_chat = result.get("chat") if isinstance(result, dict) else None
              message_id = result.get("message_id") if isinstance(result, dict) else None
              if (not isinstance(reply_chat, dict) or reply_chat.get("id") != int(chat)
                  or type(message_id) is not int or message_id <= previous):
                  raise SystemExit(f"Telegram acknowledgement did not verify for part {index}/{len(parts)}. Do not retry.")
              print(f"Telegram accepted multipart sample part={index}/{len(parts)} message_id={message_id}", flush=True)
              previous = message_id
          print(f"Telegram accepted all {len(parts)} multipart sample parts in order.", flush=True)
          PY
