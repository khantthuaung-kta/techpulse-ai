name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python 3.12 checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_PROVIDER: 'off'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Check tracked files for private data
        run: python -m scripts.check_repository
      - name: Lint Python
        run: python -m ruff check src techpulse scripts tests
      - name: Type-check implementation
        run: python -m mypy src techpulse scripts
      - name: Run regression tests
        run: python -m pytest -q
      - name: Verify the offline demo
        run: python -m scripts.demo --check
      - name: Audit installed dependencies
        run: python -m pip_audit --strict --local
