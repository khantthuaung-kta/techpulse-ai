name: One-time Telegram connectivity test
on:
  pull_request:
    branches: [main]
    types: [opened]
permissions:
  contents: read
concurrency:
  group: one-time-telegram-check-9
  cancel-in-progress: false
jobs:
  connectivity:
    if: >-
      github.repository == 'khantthuaung-kta/techpulse-ai' &&
      github.event.pull_request.number == 9 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dot/telegram-connection-test-20261124' &&
      github.event.pull_request.user.login == 'khantthuaung-kta' &&
      github.event.pull_request.draft == true &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify private preview (no send or content output)
        env:
          TECHPULSE_DIGEST_READ_TOKEN: ${{ secrets.TECHPULSE_DIGEST_READ_TOKEN }}
        run: python -m src.main --check-dot-preview=2026-11-24
      - name: Send one labeled test to the existing Telegram recipient
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not re.fullmatch(r"[0-9]+:[A-Za-z0-9_-]+", token) or not re.fullmatch(r"-?[1-9][0-9]{0,17}", chat):
              raise SystemExit("The existing Telegram destination has not been verified; nothing sent.")
          body = json.dumps(
              {
                  "chat_id": int(chat),
                  "text": "✅ TechPulse စမ်းသပ်စာ: Telegram ချိတ်ဆက်မှု စစ်တာပါ။ ဒီစာက နေ့စဉ်သတင်း မဟုတ်ပါဘူး။",
                  "link_preview_options": {"is_disabled": True},
              },
              ensure_ascii=False,
          ).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage", body,
              {"Content-Type": "application/json"}, method="POST",
          )
          try:
              with urllib.request.build_opener(NoRedirect).open(request, timeout=12) as response:
                  data = json.loads(response.read(131072))
          except (OSError, ValueError):
              raise SystemExit("Telegram did not confirm delivery. Do not retry this test.") from None
          result = data.get("result") if isinstance(data, dict) and data.get("ok") is True else None
          reply_chat = result.get("chat") if isinstance(result, dict) else None
          message_id = result.get("message_id") if isinstance(result, dict) else None
          if not isinstance(reply_chat, dict) or reply_chat.get("id") != int(chat) or type(message_id) is not int or message_id < 1:
              raise SystemExit("Telegram acknowledgement could not be verified. Do not retry.")
          print(f"Telegram accepted exactly one test message; message_id={message_id}")
          PY
